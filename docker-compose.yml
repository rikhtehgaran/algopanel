services:
  db:
    image: mariadb:10.11
    container_name: algopanel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dbispconfig
      MYSQL_USER: ispconfig
      MYSQL_PASSWORD: ispconfig_password
    volumes:
      - db_data:/var/lib/mysql
      - ./install/sql/ispconfig3.sql:/docker-entrypoint-initdb.d/01-ispconfig3.sql:ro
      - ./.docker/init-admin.sql:/docker-entrypoint-initdb.d/02-init-admin.sql:ro
    ports:
      - "33066:3306"

  php:
    build:
      context: .docker
      dockerfile: Dockerfile.php
    container_name: algopanel-php
    restart: unless-stopped
    volumes:
      - .:/usr/local/ispconfig
      - ./.docker/php.ini:/usr/local/etc/php/conf.d/ispconfig.ini:ro
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: algopanel-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/usr/local/ispconfig:ro
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db_data:
