<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja">
<head>
    <title>503 Service Unavailable</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex" />
    <style type="text/css"><!--
    body { color: #444; background-color: #EEEEEE; font-family: sans-serif; font-size: 90%; }
    #page{ background-color: #FFFFFF; width: 70%; max-width: 700px; margin: 40px auto; padding: 30px 30px 0 30px; border: 1px solid #DDD; border-radius: 4px; overflow: hidden; }
    #header { padding: 15px; text-align: center; background-color: #F2E81A; color: #000; color: #FFFFFF; margin: -30px -30px 25px -30px; }
    h1 { margin: 0; font-size: 1.6em; }
    #content { padding: 10px 0 30px 0; text-align: center; line-height: 1.8; }
    .jp-main { font-size: 1.3em; font-weight: bold; color: #111; display: block; margin-bottom: 8px; }
    .jp-sub { font-size: 1.0em; color: #333; display: block; margin-bottom: 20px; }
    .en-small { font-size: 0.85em; color: #888; font-style: italic; display: block; line-height: 1.4; }
    /* フッターをスリム化 */
    #footer { color: #999; background: #f9f9f9; padding: 8px 15px; border-top: 1px #EEE solid; font-size: 0.8em; text-align: center; margin: 0 -30px; }
    #footer a { color: #999; text-decoration: none; }
    --></style>
</head>
<body>
    <div id="page">
        <div id="header"><h1>ERROR 503 - Service Unavailable!</h1></div>
        <div id="content">
            <span class="jp-main">サービスをご利用いただけません</span>
            <span class="jp-sub">現在サーバーが過負荷状態にあるか、メンテナンス中です。<br />恐れ入りますが、しばらくしてからもう一度お試しください。</span>
            <span class="en-small">The Service is not available at the moment due to a temporary overloading or maintenance of the server.<br />Please try again later.</span>
        </div>
        <div id="footer"><a href="https://www.ispconfig.org">ISPConfig Support</a></div>
    </div>
</body>
</html>
